name: deploy-pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/render_guide.py --check
      - run: python -m unittest discover -s tests -v

  unix-walkthrough:
    name: Unix walkthrough (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: bash
          - os: macos-latest
            shells: bash zsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/render_guide.py --check
      - run: python -m unittest discover -s tests -v
      - name: Run the documented Unix workflow
        shell: bash
        run: |
          set -euo pipefail
          for smoke_shell in ${{ matrix.shells }}; do
            python tests/verify_unix_walkthrough.py --shell "$smoke_shell"
          done
      - name: Retain walkthrough diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unix-walkthrough-${{ matrix.os }}
          path: |
            .preview/unix-*/terminal-*.log
            .preview/unix-*/receipt.json
            .preview/unix-*/terminal-a.sh
            .preview/unix-*/server-sample.txt
          retention-days: 7
          include-hidden-files: true

  deploy:
    needs: [validate, unix-walkthrough]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.gitignore' \
            --exclude '.site-venv' \
            --exclude '.preview' \
            --exclude '__pycache__' \
            --exclude 'scripts' \
            --exclude 'tests' \
            --exclude 'requirements-docs.txt' \
            --exclude '_site' \
            --exclude 'README.md' \
            ./ _site/
          echo "Published files:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
