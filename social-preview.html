<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scientific Tooling social preview</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #fafaff;
        color: #222738;
        padding: 56px 70px;
        font-family: Manrope, sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand img {
        width: 46px;
        height: 46px;
      }
      main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 70px;
        margin-top: 52px;
      }
      h1 {
        font-size: 72px;
        line-height: 1.12;
        letter-spacing: -4px;
        margin: 0 0 22px;
        font-weight: 650;
      }
      h1 span {
        color: #5744bd;
      }
      p {
        font-size: 22px;
        line-height: 1.7;
        max-width: 580px;
        color: #616777;
        margin: 0;
      }
      .flow {
        background: #fff;
        border: 1px solid #e4e1ef;
        border-radius: 22px;
        padding: 30px 34px;
        min-width: 290px;
        box-shadow: 0 12px 40px #30385b08;
      }
      .step {
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 22px;
        font-weight: 650;
        margin: 12px 0;
      }
      .step span {
        font-size: 14px;
        color: #5744bd;
        background: #f0edfc;
        padding: 9px 10px;
        border-radius: 8px;
      }
      .line {
        width: 1px;
        height: 20px;
        background: #e0d9f4;
        margin-left: 19px;
      }
      footer {
        font-size: 18px;
        color: #5744bd;
        margin-top: 38px;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="./logo.svg" alt="" />Scientific Tooling</div>
    <main>
      <div>
        <h1>Your research.<br /><span>A clearer path.</span></h1>
        <p>
          Open tools for you and your AI agent.<br />Start with a paper. Keep
          the evidence.
        </p>
      </div>
      <div class="flow">
        <div class="step"><span>01</span>Read a paper</div>
        <div class="line"></div>
        <div class="step"><span>02</span>Collect evidence</div>
        <div class="line"></div>
        <div class="step"><span>03</span>Build a brief</div>
      </div>
    </main>
    <footer>scientifictooling.org</footer>
  </body>
</html>
